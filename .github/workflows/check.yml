# CI lanciata a mano: si scrive "check" come commento in una pull request e
# parte l'intera suite di test, la stessa che si lancia in locale.
#
# Gira su Windows apposta: test_interfaccia e test_simulazione aprono finestre
# tkinter, e su Windows un ambiente grafico c'e' sempre, come sul PC di chi
# sviluppa.
#
# Il solutore gira in modalita' deterministica (CRANESTRIKE_DETERMINISTICO, vedi
# model.configura_solutore): la stessa linea da' la stessa soluzione qui e sul
# PC, quindi un test che passa in locale passa anche qui. Costa circa tre volte
# il tempo, e per questo i test girano su tre runner in parallelo.
#
# Un nuovo "check" mentre i test girano li annulla e li fa ripartire da capo.
# Un PUSH sulla PR li annulla e basta: il commit nuovo non ha nessuno stato
# "check", e i test vanno richiesti di nuovo scrivendo "check".
#
# Attenzione: GitHub legge i workflow "issue_comment" e "pull_request_target"
# solo dal ramo principale. Finche' questo file non e' su master, il commento
# non fa nulla, e le sue modifiche contano solo dopo essere arrivate su master.

name: check

on:
  issue_comment:
    types: [created]
  # Solo per annullare il check in corso (vedi `nuovo_push`). E' la variante
  # "_target" perche', come issue_comment, legge il workflow da master e non
  # esegue niente della PR: qui non si fa il checkout di nessun codice.
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  statuses: write        # lo stato "check" sul commit della PR
  pull-requests: write
  issues: write          # reazioni e commento col risultato

# Un nuovo "check" o un push sulla stessa PR annullano quello in corso: finiscono
# nello stesso gruppo, e `cancel-in-progress` ferma la run che c'era. La
# condizione sta anche nel nome del gruppo: un commento qualsiasi finisce in un
# altro gruppo e non interrompe un check che sta girando.
concurrency:
  group: >-
    check-pr-${{ github.event.issue.number || github.event.pull_request.number }}-${{
      github.event_name == 'pull_request_target' || (
        github.event.comment.body == 'check' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    }}
  cancel-in-progress: true

jobs:
  nuovo_push:
    # Non fa niente: basta che la run esista, nel gruppo del check, perche'
    # quella in corso venga annullata. Gli altri job su un push si saltano da
    # soli (`avvio` vuole un commento).
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Nuovo push sulla PR ${{ github.event.pull_request.number }}, check in corso annullato"

  avvio:
    # Solo sulle PR (non sulle issue), solo col commento esatto "check", e
    # solo da chi ha accesso al repository: altrimenti chiunque potrebbe far
    # girare codice sui nostri runner.
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == 'check' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Leggi la PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.head.sha);
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pr.head.sha,
              state: 'pending',
              context: 'check',
              description: 'Test in corso',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  test:
    needs: avvio
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      # tutti i gruppi vanno fino in fondo: un fallimento non deve nascondere
      # gli altri
      fail-fast: false
      matrix:
        # I due file lunghi da soli, tutto il resto insieme. "altri" prende
        # ogni test/test_*.py che non sta in un altro gruppo, quindi un test
        # nuovo gira senza toccare questo file.
        gruppo: [modello, interfaccia, altri]
    name: test (${{ matrix.gruppo }})

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.avvio.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install ortools matplotlib openpyxl

      - name: Esegui i test
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          MPLBACKEND: Agg
          CRANESTRIKE_DETERMINISTICO: "1"
          GRUPPO: ${{ matrix.gruppo }}
        run: |
          case "$GRUPPO" in
            modello)     file=(test/test_model.py) ;;
            interfaccia) file=(test/test_interfaccia.py) ;;
            altri)
              file=(kinematics.py)
              for t in test/test_*.py; do
                case "$t" in
                  test/test_model.py|test/test_interfaccia.py) ;;
                  *) file+=("$t") ;;
                esac
              done
              file+=(test/esempio.py)
              ;;
          esac

          # Il riepilogo finisce nel commento sulla PR: per ogni test fallito le
          # righe FAIL/ERROR con il dettaglio che le segue, o il traceback se il
          # test e' morto prima di arrivare in fondo.
          riepilogo="$RUNNER_TEMP/riepilogo-$GRUPPO.md"
          : > "$riepilogo"
          falliti=()
          for t in "${file[@]}"; do
            echo "::group::$t"
            inizio=$SECONDS
            python -u "$t" 2>&1 | tee "$RUNNER_TEMP/out.txt"
            rc=${PIPESTATUS[0]}
            durata=$((SECONDS - inizio))
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "OK      $t (${durata}s)"
            else
              echo "::error::FALLITO $t"
              falliti+=("$t")
              {
                echo "#### \`$t\` (${durata}s)"
                echo '```'
                if grep -q "Traceback" "$RUNNER_TEMP/out.txt"; then
                  tail -n 30 "$RUNNER_TEMP/out.txt"
                else
                  grep -E -A3 "^\s*(FAIL|ERROR)\b" "$RUNNER_TEMP/out.txt" | grep -v "RISULTATO" | head -n 60
                  grep -E "RISULTATO" "$RUNNER_TEMP/out.txt"
                fi
                echo '```'
              } >> "$riepilogo"
            fi
          done
          cat "$riepilogo" >> "$GITHUB_STEP_SUMMARY"
          echo
          if [ ${#falliti[@]} -ne 0 ]; then
            echo "Test falliti: ${falliti[*]}"
            exit 1
          fi
          echo "Tutti i test del gruppo sono passati."

      - name: Conserva il riepilogo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riepilogo-${{ matrix.gruppo }}
          path: ${{ runner.temp }}/riepilogo-${{ matrix.gruppo }}.md
          if-no-files-found: ignore
          retention-days: 1

  esito:
    # Gira anche se i test falliscono o vengono annullati: lo stato sul
    # commit non deve restare "in corso" per sempre.
    needs: [avvio, test]
    if: always() && needs.avvio.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Raccogli i riepiloghi
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: riepilogo-*
          path: riepiloghi
          merge-multiple: true

      - name: Riporta il risultato sulla PR
        uses: actions/github-script@v7
        env:
          SHA: ${{ needs.avvio.outputs.sha }}
          ESITO: ${{ needs.test.result }}
        with:
          script: |
            const ok = process.env.ESITO === 'success';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Annullato: o da un nuovo "check" sullo stesso commit, o da un push.
            // Nel primo caso lo stato e il commento li scrive la run nuova, che
            // ha gia' messo "in corso": scriverci "fallito" sopra mentre i test
            // ripartono direbbe il falso. Nel secondo il commit non e' piu' la
            // testa della PR, e si chiude il suo stato rimasto "in corso".
            if (process.env.ESITO === 'cancelled') {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              if (pr.head.sha === process.env.SHA) {
                core.info('Annullato da un nuovo check sullo stesso commit: lo stato lo scrive la run nuova.');
                return;
              }
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: process.env.SHA,
                state: 'error',
                context: 'check',
                description: 'Annullato da un nuovo push',
                target_url: url,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⏹️ **check** su \`${process.env.SHA.slice(0, 7)}\` annullato da un nuovo push ` +
                      `(\`${pr.head.sha.slice(0, 7)}\`): scrivi \`check\` per rifare i test — [log](${url})`,
              });
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.SHA,
              state: ok ? 'success' : 'failure',
              context: 'check',
              description: ok ? 'Tutti i test passano' : 'Ci sono test falliti',
              target_url: url,
            });
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: ok ? '+1' : '-1',
            });
            const fs = require('fs');
            let dettaglio = '';
            if (fs.existsSync('riepiloghi')) {
              dettaglio = fs.readdirSync('riepiloghi').sort()
                .map(f => fs.readFileSync(`riepiloghi/${f}`, 'utf8').trim())
                .filter(Boolean)
                .join('\n\n');
            }
            // un commento GitHub non supera 65536 caratteri
            if (dettaglio.length > 60000) dettaglio = dettaglio.slice(0, 60000) + '\n```\n…(tagliato, vedi il log)';
            const perche = ok ? 'tutti i test passano' : 'ci sono test falliti';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${ok ? '✅' : '❌'} **check** su \`${process.env.SHA.slice(0, 7)}\`: ` +
                    `${perche} — [log](${url})` +
                    (dettaglio ? `\n\n${dettaglio}` : ''),
            });
